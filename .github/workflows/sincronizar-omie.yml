name: Sincronizar Omie

# Puxa o contas a receber do Omie e grava no Supabase (projeto central-notas-boletos).
# O painel lê os dados direto do Supabase.
#
# Quem dispara: o Supabase (pg_cron), todos os dias (inclusive sábado e domingo)
# às 7h12 e 13h12 de Brasília,
# pela função interno.disparar_robo_omie(). O agendamento do próprio GitHub
# não disparava, por isso saiu daqui (evita rodar duas vezes se ele voltar).
# Para rodar na mão: aba Actions > Sincronizar Omie > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronizar-omie
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Puxar contas a receber do Omie e gravar no Supabase
        env:
          OMIE_APP_KEY: ${{ secrets.OMIE_APP_KEY }}
          OMIE_APP_SECRET: ${{ secrets.OMIE_APP_SECRET }}
          OMIE_DESDE: ${{ vars.OMIE_DESDE }}
          SUPABASE_URL: https://wxrwllcbfkqlyulacgzt.supabase.co
          SUPABASE_KEY: sb_publishable_XAkIjpawOcnnrTG8SuXCng_7BsJYjl7
          SUPABASE_ROBO_EMAIL: robo@central.payfy.io
          SUPABASE_ROBO_SENHA: ${{ secrets.SUPABASE_ROBO_SENHA }}
          # links de boleto do Omie valem 24 h: com 20 h de margem, cada rodada renova todos
          OMIE_RENOVAR_BOLETO_HORAS: "20"
        run: python ferramentas/omie_sync.py

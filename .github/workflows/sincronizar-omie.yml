name: Sincronizar Omie

# Puxa o contas a receber do Omie e grava no Supabase (projeto central-notas-boletos).
# O painel lê os dados direto do Supabase.
on:
  schedule:
    - cron: "0 10,16 * * 1-5"   # 7h e 13h de Brasília, dias úteis
  workflow_dispatch:            # botão "Run workflow" na aba Actions

permissions:
  contents: read

concurrency:
  group: sincronizar-omie
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Puxar contas a receber do Omie e gravar no Supabase
        env:
          OMIE_APP_KEY: ${{ secrets.OMIE_APP_KEY }}
          OMIE_APP_SECRET: ${{ secrets.OMIE_APP_SECRET }}
          OMIE_DESDE: ${{ vars.OMIE_DESDE }}
          SUPABASE_URL: https://wxrwllcbfkqlyulacgzt.supabase.co
          SUPABASE_KEY: sb_publishable_XAkIjpawOcnnrTG8SuXCng_7BsJYjl7
          SUPABASE_ROBO_EMAIL: robo@central.payfy.io
          SUPABASE_ROBO_SENHA: ${{ secrets.SUPABASE_ROBO_SENHA }}
        run: python ferramentas/omie_sync.py
